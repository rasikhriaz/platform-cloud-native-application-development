---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: platform-demo
  labels:
    app: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.platform-demo.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: platform-demo
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'platform-demo'
        orgId: 1
        folder: 'Platform'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: platform-demo
  labels:
    app: grafana
data:
  platform-demo.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "panels": [
        {
          "title": "HTTP Requests Total",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "rate(http_requests_total[5m])", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "reqps" } }
        },
        {
          "title": "CPU Usage per Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "rate(container_cpu_usage_seconds_total{namespace=\"platform-demo\", container!=\"\", container!=\"POD\"}[5m])", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "short" } }
        },
        {
          "title": "Memory Usage per Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "container_memory_usage_bytes{namespace=\"platform-demo\", container!=\"\", container!=\"POD\"}", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 10 }, "unit": "bytes" } }
        },
        {
          "title": "Running Pods",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "count(kube_pod_info{namespace=\"platform-demo\"})", "legendFormat": "Pods", "refId": "A" }],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "yellow", "value": 2 }, { "color": "green", "value": 3 }] } } }
        }
      ],
      "schemaVersion": 39,
      "tags": ["platform-demo", "kubernetes"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "Platform Demo Overview",
      "uid": "platform-demo-overview"
    }
